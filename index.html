<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XAUUSD Live Hub - Gold Charts & Flash News</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121418;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        header {
            background-color: #1a1d24;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ffd700;
        }
        h1 {
            margin: 0;
            font-size: 20px;
            color: #ffd700;
        }
        .container {
            display: flex;
            flex-direction: row;
            height: calc(100vh - 60px);
        }
        .chart-box {
            flex: 3;
            height: 100%;
            border-right: 1px solid #2a2e39;
        }
        .news-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background-color: #161920;
        }
        .news-item {
            background-color: #20242f;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 6px;
            border-left: 4px solid #ffd700;
        }
        .news-tag {
            font-size: 11px;
            font-weight: bold;
            padding: 3px 6px;
            border-radius: 3px;
            display: inline-block;
            margin-bottom: 5px;
        }
        .tag-high { background-color: #ff4d4d; color: white; }
        .tag-bull { background-color: #00b359; color: white; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ XAUUSD LIVE TERMINAL</h1>
        <div><span>Status: <strong style="color:#00b359;">Live Data Active</strong></span></div>
    </header>

    <div class="container">
        <div class="chart-box">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
              <div id="tradingview_chart" style="height:100%;width:100%"></div>
              <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
              <script type="text/javascript">
              new TradingView.widget({
                "autosize": true,
                "symbol": "OANDA:XAUUSD",
                "interval": "15",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": "tradingview_chart"
              });
              </script>
            </div>
        </div>

        <div class="news-box">
            <h3 style="margin-top:0; border-bottom: 1px solid #333; padding-bottom: 10px;">⚡ Flash Gold News</h3>
            
            <div class="news-item">
                <span class="news-tag tag-high">HIGH IMPACT</span>
                <span class="news-tag tag-bull">BULLISH GOLD</span>
                <div style="font-size: 14px; font-weight: bold; margin-top: 4px;">US Dollar Index Drops as Fed Signals Potential Rate Pause</div>
                <div style="font-size: 12px; color: #aaa; margin-top: 5px;">2 mins ago • Source: ForexLive</div>
            </div>

            <div class="news-item">
                <span class="news-tag tag-high">HIGH IMPACT</span>
                <div style="font-size: 14px; font-weight: bold; margin-top: 4px;">US CPI Inflation Data Release Scheduled for 13:30 GMT</div>
                <div style="font-size: 12px; color: #aaa; margin-top: 5px;">15 mins ago • Source: Economic Calendar</div>
            </div>
        </div>
    </div>

</body>
</html>
