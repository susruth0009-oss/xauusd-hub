<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XAUUSD Hub - Gold Trading Terminal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #121418; color: #ffffff; font-family: Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    header { background-color: #1a1d24; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2e39; }
    header h1 { font-size: 1.2rem; color: #f0b90b; }
    .badge { background-color: #f0b90b; color: #000; font-size: 0.75rem; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    .main-container { display: flex; flex: 1; flex-direction: row; overflow: hidden; }
    .chart-section { flex: 3; height: 100%; border-right: 1px solid #2a2e39; }
    .sidebar { flex: 1; min-width: 300px; height: 100%; background-color: #161920; overflow-y: auto; }
    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .chart-section { height: 60vh; border-right: none; border-bottom: 1px solid #2a2e39; }
      .sidebar { height: 40vh; width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <h1>⚡ XAUUSD Hub Terminal</h1>
    <span class="badge">PRO GOLD FEED</span>
  </header>

  <div class="main-container">
    <!-- TradingView Advanced Gold Chart Section -->
    <div class="chart-section">
      <div class="tradingview-widget-container" style="height:100%;width:100%">
        <div id="tradingview_xauusd" style="height:calc(100% - 32px);width:100%"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
          new TradingView.widget({
            "autosize": true,
            "symbol": "OANDA:XAUUSD",
            "interval": "15",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "withrequester": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "details": true,
            "hotlist": true,
            "calendar": true,
            "studies": [
              "STD;RSI",
              "STD;MA%Ribbon"
            ],
            "container_id": "tradingview_xauusd"
          });
        </script>
      </div>
    </div>

    <!-- Live Macro Economic Calendar & News Sidebar -->
    <div class="sidebar">
      <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
        {
          "colorTheme": "dark",
          "isTransparent": false,
          "width": "100%",
          "height": "100%",
          "locale": "en",
          "importanceFilter": "-1,0,1",
          "currencyFilter": "USD"
        }
        </script>
      </div>
    </div>
  </div>

</body>
</html>
